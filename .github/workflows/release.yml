### Auto build LAT and release its binary with Github Action
name: Build and Release LAT

on:
  # Select the exact release-candidate ref when running manually before release.
  workflow_dispatch:
  schedule:
    # Daily at 02:00 China Standard Time.
    - cron: "0 18 * * *"
  release:
    types: [published]
  push:
    branches:
      - master
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.S"
      - "**/*.py"
      - "**/meson.build"
      - "meson.options"
      - "meson_options.txt"
      - "configure"
      - "Makefile"
      - "GNUmakefile"
      - "meson"
      - "meson/**"
      - "latxbuild/**"
      - "configs/**"
      - "**/*.mak"
      - ".gitmodules"
      - ".github/.ci/**"
      - "**/*.inc"
      - "**/*.yml"
      - "runtime/**"
      - "tests/runtime/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.S"
      - "**/*.py"
      - "**/meson.build"
      - "meson.options"
      - "meson_options.txt"
      - "configure"
      - "Makefile"
      - "GNUmakefile"
      - "meson"
      - "meson/**"
      - "latxbuild/**"
      - "configs/**"
      - "**/*.mak"
      - ".gitmodules"
      - ".github/.ci/**"
      - "**/*.inc"
      - "**/*.yml"
      - "runtime/**"
      - "tests/runtime/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A manual candidate run covers all three workflows together.
  # Automatic runs trigger tests.yml and clang.yml directly.
  candidate-tests:
    needs: select-matrix
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tests.yml

  candidate-clang:
    needs: select-matrix
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/clang.yml

  select-matrix:
    name: Select CI coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build_types: ${{ steps.matrix.outputs.build_types }}
      test_containers: ${{ steps.matrix.outputs.test_containers }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select PR or full matrix
        id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/lat_ci_matrix.py

  build:
    needs: select-matrix
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - { NAME: 'latx-runner-aosc', ARCH_NAME: 'loong64' }
          - { NAME: 'latx-runner-debian', ARCH_NAME: 'loong64' }
          - { NAME: 'latx-runner-fedora', ARCH_NAME: 'loongarch64' }
        type: ${{ fromJSON(needs.select-matrix.outputs.build_types) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Cache
        uses: actions/cache@v6
        with:
          path: /tmp/.cache
          key: ${{ matrix.container.NAME }}-${{ matrix.type.NAME }}-${{ github.sha }}
          restore-keys: ${{ matrix.container.NAME }}-${{ matrix.type.NAME }}-

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: "Build LATX"
        run: |
          DOCKER_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.container.NAME }}:${{ matrix.container.ARCH_NAME }}"
          DOCKER_CMD="./latxbuild/${{ matrix.type.NAME }}.sh ${{ matrix.type.OPT }}"
          docker run --rm \
            --platform linux/loong64 \
            --volume /tmp/.cache:/root/.cache \
            --volume "$(pwd):/io" \
            --workdir /io \
            "$DOCKER_IMAGE" \
            sh -c "$DOCKER_CMD"

      - name: "Get short Git commit"
        run: |
          echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.container.NAME }}-${{ matrix.type.NAME }}-${{ env.SHORT_COMMIT }}
          path: |
            ${{ matrix.type.NAME }}/latx-i386
            ${{ matrix.type.NAME }}/latx-x86_64
            *.tar.xz
          retention-days: 7
          # Allow retrying this build job within the same workflow run.
          overwrite: true
          if-no-files-found: error
